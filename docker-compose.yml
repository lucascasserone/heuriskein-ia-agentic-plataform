version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: heuriskein_postgres
    environment:
      POSTGRES_DB: heuriskein_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: heuriskein_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heuriskein_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py createsuperuser --noinput --username admin --email admin@localhost || true &&
             daphne -b 0.0.0.0 -p 8001 heuriskein.asgi:application"
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: "django-insecure-change-me-in-production"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/heuriskein_db"
      REDIS_URL: "redis://redis:6379/0"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      NEXT_PUBLIC_API_URL: "http://localhost:8001/api/v1"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8001/ws"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - heuriskein_network

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heuriskein_celery
    command: celery -A heuriskein worker -l info
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: "django-insecure-change-me-in-production"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/heuriskein_db"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - db
      - redis
      - backend
    volumes:
      - ./backend:/app
    networks:
      - heuriskein_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: heuriskein_frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8001/api/v1"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8001/ws"
    ports:
      - "8000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - heuriskein_network

volumes:
  postgres_data:
  redis_data:

networks:
  heuriskein_network:
    driver: bridge
