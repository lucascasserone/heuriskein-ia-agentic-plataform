services:
  - type: web
    name: heuriskein-ia-agentic-plataform
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "heuriskein-ia-agentic-plataform.onrender.com,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://heuriskein-ia-agentic-plataform.vercel.app,https://frontend-7s11uanem-lucascasserones-projects.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://heuriskein-ia-agentic-plataform.vercel.app"
      - key: LLM_PROVIDER
        value: "anthropic"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
